[package]
name = "lf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Optional Rust command-line client for LocalFlow local data (Stage 1)"

[lib]
name = "lf"
path = "src/lib.rs"

[[bin]]
name = "lf-rs"
path = "src/main.rs"

[dependencies]
lf-core = { path = "../lf-core" }
lf-providers = { path = "../lf-providers" }
lf-server = { path = "../lf-server" }
lf-stt = { path = "../lf-stt", default-features = false, features = ["setup"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
unicode-width = "0.2"
chrono = { workspace = true }
# Facade for lf-core's warnings; `run_main` installs a small stderr logger.
log = { workspace = true }
# `status` only talks plain HTTP to the loopback server.
reqwest = { workspace = true }
# Clipboard for `history copy`/`history raw`; image support is not needed.
arboard = { version = "3", default-features = false }

[dev-dependencies]
tempfile = { workspace = true }
# The parity example serializes lf-core values generically.
serde = { workspace = true }
