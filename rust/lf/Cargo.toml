[package]
name = "lf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Optional Rust command-line client for LocalFlow local data (Stage 1)"

[lib]
name = "lf"
path = "src/lib.rs"

[[bin]]
name = "lf-rs"
path = "src/main.rs"

[dependencies]
lf-agent = { path = "../lf-agent" }
lf-ask = { path = "../lf-ask" }
lf-core = { path = "../lf-core" }
lf-meetings = { path = "../lf-meetings", features = ["capture"] }
lf-meetings-backend = { path = "../lf-meetings-backend" }
lf-providers = { path = "../lf-providers" }
lf-runtime = { path = "../lf-runtime" }
lf-server = { path = "../lf-server" }
lf-stt = { path = "../lf-stt", features = ["runtime", "server", "setup"] }
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
unicode-width = "0.2"
chrono = { workspace = true }
# Facade for lf-core's warnings; `run_main` installs a small stderr logger.
log = { workspace = true }
# `status` only talks plain HTTP to the loopback server.
reqwest = { workspace = true }
# Clipboard for `history copy`/`history raw`; image support is not needed.
arboard = { version = "3", default-features = false }
# `secret set` reads the value from a terminal without echoing it.
rpassword = "7"
# `hub --page` folds case like click's `Choice(case_sensitive=False)`.
caseless = { workspace = true }
# `hub --gpui` reads the macOS preview bundle's Info.plist (pure Rust).
plist = "1"
# zlib for the PNGs of the `setup install-app` icon (macOS).
flate2 = "1"

[target.'cfg(unix)'.dependencies]
# `agent` (launchd) needs the uid for `gui/<uid>` and log ownership checks;
# `hub --gpui`: `access(X_OK)` and `setsid` for the detached preview window.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# `stt download` matches Rich's ASCII progress bar on legacy (non-VT) consoles;
# `agent` writes the HKCU Run value.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = { workspace = true }
# The parity example serializes lf-core values generically.
serde = { workspace = true }
