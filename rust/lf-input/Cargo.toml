[package]
name = "lf-input"
version = "0.2.2"
edition = "2021"
description = "Global hotkeys and text insertion for the LocalFlow Rust port"
license = "MIT"

[dependencies]
log = { workspace = true }
arboard = { version = "3", default-features = false }

# Linux X11 global shortcuts: listen-only XInput2 raw key events through the
# pure-Rust x11rb connection (no grabs, no subprocess, no root/evdev access).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xinput"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
foreign-types = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
