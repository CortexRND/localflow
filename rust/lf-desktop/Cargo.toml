[package]
name = "lf-desktop"
version = "0.2.2"
edition = "2021"
license = "MIT"
publish = false
description = "LocalFlow native desktop app (GPUI). Parallel front end; not the default launcher yet."

# Standalone workspace: keeps GPUI's dependency tree and system libraries out
# of the parent `rust/` workspace and its CI. Build with
# `cargo build --manifest-path rust/lf-desktop/Cargo.toml`.
[workspace]
members = [".", "vendor/xattr-shim"]

[[bin]]
name = "lf-desktop"
path = "src/main.rs"

[lib]
name = "lf_desktop"
path = "src/lib.rs"

[features]
default = []
# Opt-in native engine: speech-model download/inspection/delete, the setup
# microphone trial and in-window dictation (`--engine`). Forwards to the
# shared `lf-ui/runtime` stack; the default build stays a front end only.
runtime = ["lf-ui/runtime", "dep:lf-stt"]

[dependencies]
gpui = "=0.2.2"
lf-core = { path = "../lf-core" }
lf-ui = { path = "../lf-ui" }
lf-providers = { path = "../lf-providers" }
lf-audio = { path = "../lf-audio" }
lf-runtime = { path = "../lf-runtime" }
lf-input = { path = "../lf-input" }
lf-agent = { path = "../lf-agent" }
lf-stt = { path = "../lf-stt", optional = true, features = ["setup"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
anyhow = "1"
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
unicode-segmentation = "1"
log = "0.4"
# Assistant output redaction (already in the lockfile through lf-ui).
regex = "1"
env_logger = "0.11"

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
async-channel = "2"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.2", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.21.2", default-features = false }

# Frontmost-app pid for the menu bar item's paste-target check (already locked
# through lf-runtime).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

# Runtime-status probe: signal-0 liveness check of the PID a status file names.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Headless GPUI windows (`TestAppContext`) for shell keyboard tests. Dev-only:
# the binary's gpui features are unchanged.
gpui = { version = "=0.2.2", features = ["test-support"] }

# GPUI 0.2.2 -> zed-async-tar -> xattr 0.2.3 does not build against the libc
# that lf-core's keyring backend requires. See vendor/xattr-shim/src/lib.rs.
[patch.crates-io]
xattr = { path = "vendor/xattr-shim" }

[profile.dev]
# GPUI is slow unoptimised; keep our own code debuggable.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
