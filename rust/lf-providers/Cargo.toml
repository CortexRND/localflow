[package]
name = "lf-providers"
version = "0.2.1"
edition = "2021"
publish = false
description = "LocalFlow LLM providers, provider keys and endpoint-bound activation snapshots"

[lib]
name = "lf_providers"
path = "src/lib.rs"

[dependencies]
lf-core = { path = "../lf-core" }
anyhow = "1"
log = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }

[dev-dependencies]
tempfile = "3"
