[package]
name = "lf-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "LocalFlow native Hub pages and shared UI primitives"

[lib]
name = "lf_ui"
path = "src/lib.rs"

[dependencies]
lf-core = { path = "../lf-core" }
lf-providers = { path = "../lf-providers" }
lf-runtime = { path = "../lf-runtime" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
caseless = { workspace = true }
log = { workspace = true }
sha2 = "0.10"
regex = "1"

# OS-backed serialization of page-request consumers.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The AppKit layer (`lf_ui::mac`). macOS only: nothing here is built or linked
# on other platforms.
[target.'cfg(target_os = "macos")'.dependencies]
lf-input = { path = "../lf-input" }
objc2 = "0.6"
objc2-foundation = "0.3"
# Default features cover every AppKit class; the two extra features expose
# `NSView::layer` (CALayer) and `NSColor::CGColor` for the token styling.
objc2-app-kit = { version = "0.3", features = ["objc2-quartz-core", "objc2-core-graphics"] }
# Same family as the above: CALayer (layer-backed token styling) and CGColor.
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
# Blocks for `NSTimer` callbacks (the objc2 family's block crate).
block2 = "0.6"
[[bin]]
name = "lf-hub"
path = "src/bin/lf-hub.rs"

[[example]]
name = "snapshots"
path = "examples/snapshots.rs"

[[test]]
name = "native_accessibility"
path = "tests/native_accessibility.rs"
harness = false

[dev-dependencies]
tempfile = { workspace = true }
