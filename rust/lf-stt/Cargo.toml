[package]
name = "lf-stt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[features]
default = ["whisper", "parakeet"]
whisper = ["dep:whisper-rs"]
parakeet = ["dep:sherpa-onnx"]
runtime = ["dep:lf-runtime", "dep:lf-audio"]
setup = ["dep:lf-providers", "dep:reqwest", "dep:sha2", "dep:fs2"]
server = ["dep:lf-server", "dep:lf-providers", "dep:lf-audio", "dep:multer", "dep:futures-util", "dep:futures-executor", "dep:wait-timeout"]

[dependencies]
lf-core = { path = "../lf-core" }
lf-runtime = { path = "../lf-runtime", optional = true }
lf-server = { path = "../lf-server", optional = true }
lf-providers = { path = "../lf-providers", optional = true }
lf-audio = { path = "../lf-audio", optional = true }
multer = { version = "3", optional = true }
futures-util = { version = "0.3", optional = true }
futures-executor = { version = "0.3", optional = true }
wait-timeout = { version = "0.2", optional = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
regex.workspace = true
getrandom.workspace = true
log.workspace = true
same-file = "1"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }
reqwest = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }
fs2 = { version = "0.4", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
sherpa-onnx = { version = "2.0.1", optional = true, default-features = false, features = ["shared"] }

[target.'cfg(not(any(target_os = "linux", target_os = "windows", target_os = "macos")))'.dependencies]
sherpa-onnx = { version = "2.0.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", optional = true, features = ["metal", "log_backend"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16.0", optional = true, features = ["log_backend"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
lf-audio = { path = "../lf-audio" }
lf-meetings = { path = "../lf-meetings" }
lf-meetings-backend = { path = "../lf-meetings-backend" }
clap.workspace = true
hound = "3.5"
memory-stats = "1.2"
rubato = "0.16.2"
env_logger = "0.11"
tokio = { version = "1", features = ["net"] }

[[test]]
name = "helper_process"
harness = false
required-features = ["runtime"]
