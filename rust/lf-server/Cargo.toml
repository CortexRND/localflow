[package]
name = "lf-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Optional axum HTTP server for LocalFlow"

[dependencies]
lf-core = { path = "../lf-core" }
lf-providers = { path = "../lf-providers" }
anyhow.workspace = true
serde_json.workspace = true
reqwest.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "sync"] }
include_dir = "0.7"
subtle = "2"
url = "2"
percent-encoding = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile.workspace = true
