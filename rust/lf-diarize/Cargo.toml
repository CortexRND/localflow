[package]
name = "lf-diarize"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Meeting speaker labels: alignment, clustering and an optional sherpa-onnx backend"

[features]
default = []
# The real backend. Off by default so a plain build links no new native library.
sherpa = ["dep:sherpa-onnx", "dep:sha2"]

[dependencies]
lf-core = { path = "../lf-core" }
anyhow.workspace = true
log.workspace = true
sha2 = { version = "0.10", optional = true }

# Same target split as lf-stt, so feature unification never flips static/shared linkage.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
sherpa-onnx = { version = "2.0.1", optional = true, default-features = false, features = ["shared"] }

[target.'cfg(not(any(target_os = "linux", target_os = "windows", target_os = "macos")))'.dependencies]
sherpa-onnx = { version = "2.0.1", optional = true }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
