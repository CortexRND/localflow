[package]
name = "lf-meetings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
capture = ["dep:cpal"]

[dependencies]
lf-core = { path = "../lf-core" }
lf-providers = { path = "../lf-providers" }
lf-diarize = { path = "../lf-diarize" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
regex.workspace = true
caseless.workspace = true
log.workspace = true
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-general-category = "1"
# The voiceprint export ZIP: deflate only, no default codecs (the version is
# already locked through sherpa-onnx-sys); flate2's default pure-Rust backend.
zip = { version = "9.6", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
cpal = { version = "0.16", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-media = "0.3"
objc2-core-audio = "0.3"
block2 = "0.6"

[dev-dependencies]
tempfile.workspace = true
lf-agent = { path = "../lf-agent" }
lf-ask = { path = "../lf-ask" }
