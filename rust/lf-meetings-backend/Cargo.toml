[package]
name = "lf-meetings-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Injectable meeting, Ask and prompt routes for lf-server"

[dependencies]
lf-server = { path = "../lf-server" }
lf-runtime = { path = "../lf-runtime" }
lf-meetings = { path = "../lf-meetings" }
lf-ask = { path = "../lf-ask" }
lf-core = { path = "../lf-core" }
lf-providers = { path = "../lf-providers" }
anyhow.workspace = true
serde_json.workspace = true
chrono.workspace = true
log.workspace = true
# Enrollment uploads, parsed in memory like lf-stt's /transcribe (all locked).
multer = "3"
futures-util = "0.3"
futures-executor = "0.3"
wait-timeout = "0.2"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
tempfile.workspace = true
