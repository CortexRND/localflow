[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper",
    "huggingface_hub",
    "sounddevice",
    "numpy",
    "pynput",
    "pyperclip",
    "requests",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "click",
    "rich",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
mlx = ["mlx-whisper"]
parakeet = ["parakeet-mlx"]
menubar = ["rumps"]
macos-permissions = [
    "pyobjc-framework-AVFoundation>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "pyobjc-framework-IOKit>=10; sys_platform == 'darwin'",
]

[project.scripts]
localflow = "localflow.app:main"
localflow-server = "localflow.server:main"
lf = "localflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["localflow"]
