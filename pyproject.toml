[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper",
    "sounddevice",
    "numpy",
    "pynput",
    "pyperclip",
    "requests",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "click",
    "rich",
    "platformdirs",
    "keyring",
]

[project.optional-dependencies]
mlx = ["mlx-whisper"]
parakeet = ["parakeet-mlx"]
menubar = ["rumps"]

[project.scripts]
localflow = "localflow.app:main"
localflow-server = "localflow.server:main"
lf = "localflow.cli:main"

[project.entry-points."localflow.stt_providers"]
faster-whisper = "localflow.providers.stt_faster_whisper:FasterWhisperSTT"
mlx-whisper = "localflow.providers.stt_mlx_whisper:MlxWhisperSTT"
parakeet = "localflow.providers.stt_parakeet:ParakeetSTT"

[project.entry-points."localflow.llm_providers"]
ollama = "localflow.providers.llm_ollama:OllamaLLM"
openai-compatible = "localflow.providers.llm_openai_compat:OpenAICompatLLM"

[dependency-groups]
dev = ["ruff"]

[tool.hatch.build.targets.wheel]
packages = ["localflow"]
