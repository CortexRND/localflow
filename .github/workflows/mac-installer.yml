name: Mac installer

on:
  push:
    tags:
      - 'v*'
    paths:
      - install.sh
      - scripts/build_mac_installer.sh
      - packaging/**
      - .github/workflows/mac-installer.yml
  pull_request:
    paths:
      - install.sh
      - scripts/build_mac_installer.sh
      - packaging/**
      - .github/workflows/mac-installer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build installer disk image
        run: bash scripts/build_mac_installer.sh
      - name: Validate app bundle
        run: |
          app="dist/Install LocalFlow.app"
          plutil -lint "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/install-localflow"
          cmp install.sh "$app/Contents/Resources/install.sh"
      - name: Verify disk image
        run: |
          hdiutil verify dist/LocalFlow-Installer.dmg
          mount_point="$(mktemp -d)"
          hdiutil attach dist/LocalFlow-Installer.dmg -readonly -nobrowse -mountpoint "$mount_point"
          test -x "$mount_point/Install LocalFlow.app/Contents/MacOS/install-localflow"
          test -f "$mount_point/Read Me.txt"
          hdiutil detach "$mount_point"
      - uses: actions/upload-artifact@v4
        with:
          name: LocalFlow-Installer-dmg
          path: dist/LocalFlow-Installer.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: LocalFlow-Installer-windows
          path: packaging/windows/Install LocalFlow.cmd
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/release-assets.sh "$GITHUB_REF_NAME"
          cp dist/LocalFlow-Installer.dmg dist/release/LocalFlow-Installer.dmg
          # GitHub replaces spaces in uploaded asset names with dots, so stage the
          # Windows launcher under its published name and checksum that exact name.
          cp "packaging/windows/Install LocalFlow.cmd" dist/release/Install.LocalFlow.cmd
          (cd dist/release && shasum -a 256 LocalFlow-Installer.dmg Install.LocalFlow.cmd >> SHA256SUMS)
          # Fail closed: every listed file must exist and match, and every staged
          # asset must be listed under the exact (space-free) name it uploads as.
          (cd dist/release && shasum -a 256 -c SHA256SUMS)
          for asset in dist/release/*; do
            name="${asset##*/}"
            [[ "$name" == SHA256SUMS ]] && continue
            if [[ "$name" == *" "* ]] || ! awk -v n="$name" '$2 == n { found = 1 } END { exit !found }' dist/release/SHA256SUMS; then
              echo "Release asset not checksummed under its upload name: $name" >&2
              exit 1
            fi
          done
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber

  # Additive LocalFlow Preview (native GPUI) packages. The build job above and
  # its SHA256SUMS stay exactly as they are: a preview failure cannot block or
  # change the default release, and install.sh's trust file is never touched.
  gpui-preview:
    # Tags and manual runs only: pull requests already build the package in
    # gpui-package.yml's own run, so the expensive native legs never run twice.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/gpui-package.yml

  publish-gpui-preview:
    # Tags only, after the build job has created the release, so there is one
    # writer per asset and no race with the default upload.
    needs: [build, gpui-preview]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gpui-preview-*
          path: dist/gpui-preview-artifacts
      - name: Upload GPUI preview to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fails closed on a missing, extra, misnamed or tampered archive, a
          # changed platform set or a tag/version mismatch.
          scripts/gpui_preview_assets.sh "$GITHUB_REF_NAME" dist/gpui-preview-artifacts dist/gpui-preview-release
          # The build job creates the release; never create a second one here.
          gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" dist/gpui-preview-release/* --clobber
