name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lf-ui-snapshots:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      PYNPUT_BACKEND: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Native lf-ui tests
        working-directory: rust
        run: cargo test -p lf-ui

      - name: Rust Hub snapshots
        working-directory: rust
        run: cargo run -p lf-ui --example snapshots -- ../artifacts/rust-ui

      - name: Rust Hub idle RSS
        env:
          LOCALFLOW_CONFIG: ${{ runner.temp }}/rust-hub-config.toml
        run: |
          cargo build --manifest-path rust/Cargo.toml -p lf-ui --bin lf-hub --release
          bash scripts/ci_hub_rss.sh Rust artifacts/rust-ui/idle-rss.txt rust/target/release/lf-hub --page Home

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-ui-snapshots
          path: artifacts/rust-ui
          if-no-files-found: error

      - uses: actions/setup-python@v5
        if: always()
        continue-on-error: true
        with:
          python-version: "3.12"

      - name: Install Python UI dependencies
        if: always()
        continue-on-error: true
        run: pip install -e . pytest

      - name: Python Hub snapshots
        if: always()
        continue-on-error: true
        run: python scripts/mac_ui_snapshots.py

      - name: Python Hub idle RSS
        if: always()
        continue-on-error: true
        env:
          LOCALFLOW_CONFIG: ${{ runner.temp }}/python-hub-config.toml
        run: bash scripts/ci_hub_rss.sh Python artifacts/mac-ui/idle-rss.txt python -m localflow.hub_mac

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: python-ui-snapshots
          path: artifacts/mac-ui

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      PYNPUT_BACKEND: dummy
      # The parity suite fails instead of skipping when the binary is missing.
      LF_RUST_PARITY_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # lf-core vendors libdbus (dbus-secret-service "vendored"), arboard uses
      # pure-Rust X11 and reqwest uses rustls, so no system -dev packages are
      # needed; pkg-config is installed only as a harmless safety net.
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      - name: cargo fmt
        working-directory: rust
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        working-directory: rust
        run: cargo test --workspace

      - name: Build lf-rs
        working-directory: rust
        run: cargo build --bin lf-rs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The parity suite only imports localflow's config, history, dictionary,
      # symbols, formatting and hot-phrase modules: their third-party imports
      # are numpy, platformdirs and keyring. The package itself is installed
      # without the heavy speech/UI dependencies.
      - name: Install Python parity dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy platformdirs keyring
          python -m pip install --no-deps -e .

      - name: Rust/Python parity tests
        run: python -m pytest -q tests/test_rust_parity.py
