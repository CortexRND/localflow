name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      PYNPUT_BACKEND: dummy
      # The parity suite fails instead of skipping when the binary is missing.
      LF_RUST_PARITY_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # lf-audio/cpal needs ALSA headers. lf-core vendors libdbus, arboard
      # uses pure-Rust X11, and reqwest uses rustls.
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev

      - name: cargo fmt
        working-directory: rust
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        working-directory: rust
        run: cargo test --workspace

      - name: Build lf-rs
        working-directory: rust
        run: cargo build --bin lf-rs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The parity suite only imports localflow's config, history, dictionary,
      # symbols, formatting and hot-phrase modules: their third-party imports
      # are numpy, platformdirs and keyring. The package itself is installed
      # without the heavy speech/UI dependencies.
      - name: Install Python parity dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy platformdirs keyring
          python -m pip install --no-deps -e .

      - name: Rust/Python parity tests
        run: python -m pytest -q tests/test_rust_parity.py
