name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-hotkeys:
    name: Windows global hotkeys
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Register and exercise the Windows hook
        working-directory: rust
        run: cargo test --locked -p lf-input -- --include-ignored

  memory:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      HF_HUB_CACHE: ${{ github.workspace }}/.hf-cache/hub
      LF_MEMORY_PROBE: ${{ github.workspace }}/artifacts/memory/mac-memory-probe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/cache@v4
        with:
          path: .hf-cache
          key: memory-parakeet-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Restore native release libraries
        run: |
          if [ -d rust/target/sherpa-onnx-prebuilt ]; then
            find rust/target/sherpa-onnx-prebuilt -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          fi
          cargo clean --manifest-path rust/Cargo.toml -p sherpa-onnx-sys --release
      - name: Build kernel footprint and RSS probe
        run: |
          mkdir -p artifacts/memory
          cc -O2 -Wall -Werror scripts/mac_memory_probe.c -lproc -o "$LF_MEMORY_PROBE"
          "$LF_MEMORY_PROBE" $$
          if "$LF_MEMORY_PROBE" 0; then exit 1; fi
      - name: Same-runner baseline and optimized page RSS
        env:
          LOCALFLOW_CONFIG: ${{ runner.temp }}/memory-config/config.toml
        run: |
          mkdir -p "$(dirname "$LOCALFLOW_CONFIG")" artifacts/memory
          printf 'config_version = 2\n\n[setup]\nversion = 1\n' > "$LOCALFLOW_CONFIG"
          export CARGO_TARGET_DIR="$PWD/rust/target"
          baseline="$RUNNER_TEMP/localflow-memory-baseline"
          # The baseline profile driver is pinned to the last known-compatible
          # revision (PR54 on main, green memory CI). Overlaying HEAD drags in
          # newer app APIs (Setup, hub_route window planning, launch agent)
          # that the 991677fc baseline lacks, and would distort the baseline.
          profile_driver_rev=ce56b6130c4289f89a4d13dbc4aa1ddb78befc18
          git diff 991677fc "$profile_driver_rev" -- rust/lf-ui/src/mac/app.rs rust/lf-ui/src/mac.rs > "$RUNNER_TEMP/profile-driver.patch"
          git worktree add --detach "$baseline" 991677fc
          git -C "$baseline" apply "$RUNNER_TEMP/profile-driver.patch"
          git show "$profile_driver_rev:rust/lf-ui/src/mac/memory_profile.rs" > "$baseline/rust/lf-ui/src/mac/memory_profile.rs"
          git show "$profile_driver_rev:rust/lf-ui/src/launch_agent.rs" > "$baseline/rust/lf-ui/src/launch_agent.rs"
          printf '\npub mod launch_agent;\n' >> "$baseline/rust/lf-ui/src/lib.rs"
          git show "$profile_driver_rev:rust/lf-ui/src/termination.rs" > "$baseline/rust/lf-ui/src/termination.rs"
          printf '\n#[cfg(unix)]\nmod termination;\n' >> "$baseline/rust/lf-ui/src/lib.rs"
          CARGO_TARGET_DIR="$baseline/target" cargo build --manifest-path "$baseline/rust/Cargo.toml" --release -p lf-ui --bin lf-hub --features runtime
          bash scripts/ci_hub_pages.sh "$PWD/artifacts/memory/before" "$baseline/target/release/lf-hub" --page Home
          cargo build --manifest-path rust/Cargo.toml --release -p lf-ui --bin lf-hub --features runtime
          bash scripts/ci_hub_pages.sh "$PWD/artifacts/memory/after" rust/target/release/lf-hub --page Home
          python3 - <<'PY'
          import csv, os
          from pathlib import Path
          root = Path('artifacts/memory')
          before = {row[0]: row[1:] for row in csv.reader((root / 'before/pages.csv').open())}
          after = {row[0]: row[1:] for row in csv.reader((root / 'after/pages.csv').open())}
          text = '| State | Before RSS KiB | Before footprint KiB | After RSS KiB | After footprint KiB |\n| --- | ---: | ---: | ---: | ---: |\n'
          for key, values in before.items():
              text += f'| {key} | {values[0]} | {values[1]} | {after[key][0]} | {after[key][1]} |\n'
          (root / 'comparison.md').write_text(text)
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary: summary.write(text)
          PY
          python3 scripts/ci_memory_analysis.py artifacts/memory/after
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unchanged Python Hub-only page RSS and footprint
        env:
          LOCALFLOW_CONFIG: ${{ runner.temp }}/memory-config/python.toml
          PYNPUT_BACKEND: dummy
        run: |
          pip install -e .
          printf 'config_version = 2\n\n[setup]\nversion = 1\n' > "$LOCALFLOW_CONFIG"
          python scripts/ci_python_hub_pages.py artifacts/memory/python
      - name: Build real Parakeet memory benchmark
        run: cargo build --manifest-path rust/Cargo.toml --release -p lf-stt --example parakeet_memory
      - name: Parakeet variants, real session options, latency and transcript accuracy
        run: python3 scripts/ci_parakeet_memory.py "$PWD" artifacts/memory/parakeet
      - name: Real Hub speech helper memory, eviction, reload and reference accuracy
        run: python3 scripts/ci_speech_helper.py "$PWD" artifacts/memory
      - name: Real Whisper auto backend helper load, transcription and PID cleanup
        run: python3 scripts/ci_speech_helper.py "$PWD" artifacts/memory --whisper
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-measurements
          path: artifacts/memory
          if-no-files-found: error

  lf-ui-snapshots:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      PYNPUT_BACKEND: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Refresh cached native speech libraries
        shell: bash
        run: |
          if [ -d rust/target/sherpa-onnx-prebuilt ]; then
            find rust/target/sherpa-onnx-prebuilt -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          fi
          cargo clean --manifest-path rust/Cargo.toml -p sherpa-onnx-sys
          cargo clean --manifest-path rust/Cargo.toml -p sherpa-onnx-sys --release

      - name: Native lf-ui tests
        working-directory: rust
        run: cargo test -p lf-ui --features runtime

      - name: Rust Hub snapshots
        working-directory: rust
        run: cargo run -p lf-ui --example snapshots -- ../artifacts/rust-ui

      - name: Rust Hub idle RSS
        env:
          LOCALFLOW_CONFIG: ${{ runner.temp }}/rust-hub-config.toml
        run: |
          printf 'config_version = 2\n\n[setup]\nversion = 1\n' > "$LOCALFLOW_CONFIG"
          cargo build --manifest-path rust/Cargo.toml -p lf-ui --bin lf-hub --features runtime --release
          LF_RSS_EXPECT_RELEASE=1 LF_RSS_REQUIRE_MENU=1 LF_RSS_REQUIRE_RUNTIME=1 \
            bash scripts/ci_hub_rss.sh Rust artifacts/rust-ui/idle-rss.txt rust/target/release/lf-hub --page Home

      - name: Empty AppKit window idle RSS
        run: |
          cargo build --manifest-path rust/Cargo.toml -p lf-ui --example empty_appkit_window --release
          LF_RSS_EXPECT_RELEASE=1 \
            bash scripts/ci_hub_rss.sh 'Empty AppKit window' artifacts/rust-ui/empty-window-rss.txt rust/target/release/examples/empty_appkit_window

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-ui-snapshots
          path: artifacts/rust-ui
          if-no-files-found: error

      - uses: actions/setup-python@v5
        if: always()
        continue-on-error: true
        with:
          python-version: "3.12"

      - name: Install Python UI dependencies
        if: always()
        continue-on-error: true
        run: pip install -e . pytest

      - name: Python Hub snapshots
        if: always()
        continue-on-error: true
        run: python scripts/mac_ui_snapshots.py

      - name: Python Hub idle RSS
        if: always()
        continue-on-error: true
        env:
          LOCALFLOW_CONFIG: ${{ runner.temp }}/python-hub-config.toml
        # The standalone Hub has builtin super() in two PyObjC initializers.
        # Supply objc.super for this comparison without changing Python source.
        run: bash scripts/ci_hub_rss.sh 'Python (objc.super launch shim)' artifacts/mac-ui/idle-rss.txt python -c 'import objc; from localflow import hub_mac, mac_style; hub_mac.super = mac_style.super = objc.super; hub_mac.main()'

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: python-ui-snapshots
          path: artifacts/mac-ui

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      PYNPUT_BACKEND: dummy
      # The parity suite fails instead of skipping when the binary is missing.
      LF_RUST_PARITY_REQUIRED: "1"
      # Cached whisper.cpp objects must run on any runner CPU (no -march=native).
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          env-vars: GGML_NATIVE

      # cpal needs ALSA headers; whisper-rs needs CMake and libclang.
      # lf-core vendors libdbus; arboard uses X11 and HTTPS uses rustls.
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev cmake libclang-dev libportaudio2 pulseaudio

      - name: Start PulseAudio for Python HTTP contracts
        if: runner.os == 'Linux'
        run: pulseaudio --start --exit-idle-time=-1

      - name: Restore native runtimes pruned by Rust cache
        shell: bash
        run: |
          if [ -d rust/target/sherpa-onnx-prebuilt ]; then
            find rust/target/sherpa-onnx-prebuilt -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          fi
          cargo clean --manifest-path rust/Cargo.toml -p sherpa-onnx-sys
          # Cached whisper-rs-sys CMake output pins the previous Windows image's
          # MSVC path (CMAKE_ASM_COMPILER); rebuild it so CMake rediscovers cl.exe.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo clean --manifest-path rust/Cargo.toml -p whisper-rs-sys
          fi

      # The restored whisper-rs-sys CMake cache can pin an MSVC assembler path
      # from an older runner image; rebuild its native output from scratch.
      - name: Clean cached whisper-rs-sys CMake output (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo clean --manifest-path rust/Cargo.toml -p whisper-rs-sys

      - name: Ensure ffmpeg for HTTP transcription tests
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            case "${{ runner.os }}" in
              Linux) sudo apt-get update && sudo apt-get install -y ffmpeg ;;
              macOS) brew install ffmpeg ;;
              Windows) choco install ffmpeg -y --no-progress ;;
            esac
          fi

      - name: cargo fmt
        working-directory: rust
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: cargo test
        working-directory: rust
        run: cargo test --workspace --all-features

      - name: Meeting capture feature (device-free checks)
        if: runner.os != 'Linux'
        working-directory: rust
        run: |
          cargo clippy -p lf-meetings --features capture --all-targets -- -D warnings
          cargo test -p lf-meetings --features capture

      - name: Build lf-rs and localflow-mcp
        working-directory: rust
        run: cargo build --bin lf-rs --bin localflow-mcp

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Include the HTTP host dependencies for real-server contract tests.
      # Include faster-whisper because localflow.models imports its model table.
      # Install the package without the remaining heavy speech/UI dependencies.
      - name: Install Python parity dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy platformdirs keyring requests sounddevice fastapi uvicorn python-multipart click rich huggingface_hub faster-whisper
          python -m pip install --no-deps -e .

      - name: Rust/Python parity tests
        run: python -m pytest -q -s tests/test_rust_parity.py tests/test_rust_server.py tests/test_rust_mcp.py
