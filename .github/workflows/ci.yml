name: CI

on:
  push:
  pull_request:

jobs:
  test:
    env:
      PYNPUT_BACKEND: dummy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install PortAudio
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 pulseaudio
      - name: Start PulseAudio
        if: runner.os == 'Linux'
        run: pulseaudio --start --exit-idle-time=-1
      - name: Install dependencies
        run: pip install -e . ruff pytest
      - name: Ruff
        run: >-
          ruff check
          localflow/platform
          localflow/providers/base.py
          localflow/providers/factory.py
          localflow/providers/registry.py
          localflow/providers/stt_faster_whisper.py
          localflow/providers/stt_mlx_whisper.py
          localflow/providers/stt_parakeet.py
          localflow/config.py
          localflow/provider_keys.py
          tests/test_provider_keys.py
          tests/test_cli_keys.py
          tests/test_hub_provider_keys.py
          localflow/config_migrate.py
          localflow/audio.py
          localflow/context.py
          localflow/dictionary.py
          localflow/formatting.py
          localflow/stt.py
          tests/test_platform.py
          tests/test_config.py
          tests/test_dictation_toggle.py
          tests/test_dictation_ui.py
          tests/test_dictation_home_tk.py
          tests/test_providers.py
          localflow/meeting_templates.py
          localflow/system_audio.py
          localflow/meeting_client.py
          tests/test_meetings.py
          tests/test_meeting_api.py
          tests/test_meeting_client.py
          tests/test_hub_meetings_tk.py
          localflow/recall.py
          tests/test_recall.py
          localflow/ask_model.py
          localflow/ask_mac.py
          tests/test_ask_model.py
          localflow/mcp_server.py
          tests/test_mcp_server.py
          tests/test_gpui_packaging.py
          localflow/desktop_launch.py
          tests/test_desktop_launch.py
          localflow/diarization
          tests/test_diarization_align.py
          tests/test_diarization_cluster.py
          tests/test_diarization_mock.py
          tests/test_diarization_store.py
          tests/test_cli_meeting_speakers.py
      - name: Test
        run: pytest -q
