name: CI

on:
  push:
  pull_request:

jobs:
  test:
    env:
      PYNPUT_BACKEND: dummy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install PortAudio
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install dependencies
        run: pip install -e . ruff pytest
      - name: Ruff
        run: >-
          ruff check
          localflow/platform
          localflow/providers/base.py
          localflow/providers/factory.py
          localflow/providers/registry.py
          localflow/providers/stt_faster_whisper.py
          localflow/providers/stt_mlx_whisper.py
          localflow/providers/stt_parakeet.py
          localflow/config.py
          localflow/config_migrate.py
          localflow/stt.py
          tests/test_platform.py
          tests/test_config.py
          tests/test_providers.py
      - name: Test
        run: pytest -q
