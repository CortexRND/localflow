name: Installers

on:
  push:
    paths:
      - install.sh
      - install.ps1
      - pyproject.toml
      - scripts/release-assets.sh
      - scripts/build_rust_app.sh
      - scripts/macos_launchagent.sh
      - rust/lf-ui/src/launch_agent.rs
      - rust/lf-ui/src/mac/app.rs
      - tests/test_rust_packaging.py
      - tests/test_installer_workflow.py
      - tests/test_installer_stubs.py
      - .github/workflows/installers.yml
  pull_request:
    paths:
      - install.sh
      - install.ps1
      - pyproject.toml
      - scripts/release-assets.sh
      - scripts/build_rust_app.sh
      - scripts/macos_launchagent.sh
      - rust/lf-ui/src/launch_agent.rs
      - rust/lf-ui/src/mac/app.rs
      - tests/test_rust_packaging.py
      - tests/test_installer_workflow.py
      - tests/test_installer_stubs.py
      - .github/workflows/installers.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check install.sh and release-assets.sh
        run: shellcheck install.sh scripts/release-assets.sh scripts/build_rust_app.sh scripts/macos_launchagent.sh

  rust-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Headless installer checks must not start TCC-protected dictation/UI services.
      LOCALFLOW_SKIP_LAUNCHCTL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-on-failure: true
      - name: Install Python and seed its login agent without loading it
        shell: bash
        run: |
          ./install.sh --no-launch
          test ! -f "$HOME/Library/LaunchAgents/com.cortexrnd.localflow.plist"
          .venv/bin/python - <<'PY'
          from localflow.launchagent import _plist_path, plist_content
          path = _plist_path()
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(plist_content())
          PY
          cp "$HOME/Library/LaunchAgents/com.cortexrnd.localflow.plist" "$RUNNER_TEMP/python-agent.plist"
      - name: Opt into Rust twice and verify signed relocatable bundle and agent
        shell: bash
        run: |
          LOCALFLOW_RUNTIME=rust ./install.sh --no-launch
          LOCALFLOW_RUNTIME=rust ./install.sh --no-launch
          app="$HOME/Applications/LocalFlow.app"
          agent="$HOME/Library/LaunchAgents/com.cortexrnd.localflow.plist"
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist" "$agent"
          test "$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")" = lf-hub
          test "$(plutil -extract Label raw -o - "$agent")" = com.cortexrnd.localflow
          test "$(plutil -extract ProgramArguments.0 raw -o - "$agent")" = "$app/Contents/MacOS/lf-hub"
          cmp "$RUNNER_TEMP/python-agent.plist" "$agent.python.bak"
          relocated="$RUNNER_TEMP/Relocated Rust/LocalFlow.app"
          mkdir -p "$(dirname "$relocated")"
          ditto "$app" "$relocated"
          codesign --verify --deep --strict "$relocated"
          status=0
          DYLD_PRINT_LIBRARIES=1 "$relocated/Contents/MacOS/lf-hub" --packaging-smoke-test 2>"$RUNNER_TEMP/rust-dyld.log" || status=$?
          test "$status" = 2
          grep -F 'unexpected argument' "$RUNNER_TEMP/rust-dyld.log"
          grep -F "$relocated/Contents/Frameworks/" "$RUNNER_TEMP/rust-dyld.log"
      - name: Restore Python twice and uninstall both runtimes
        shell: bash
        run: |
          LOCALFLOW_RUNTIME=python ./install.sh --no-launch
          ./install.sh --no-launch
          app="$HOME/Applications/LocalFlow.app"
          agent="$HOME/Library/LaunchAgents/com.cortexrnd.localflow.plist"
          cmp "$RUNNER_TEMP/python-agent.plist" "$agent"
          test "$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")" = launcher
          test ! -e "$app/Contents/MacOS/lf-hub"
          test ! -d "$app/Contents/Frameworks"
          test -f "$agent.rust.bak"
          ./install.sh --uninstall
          test ! -e "$agent"
          test ! -d "$app"
          # The same uninstall path removes a Rust-shaped installation, too.
          ditto "$RUNNER_TEMP/Relocated Rust/LocalFlow.app" "$app"
          bash scripts/macos_launchagent.sh install-rust "$app/Contents/MacOS/lf-hub"
          LOCALFLOW_RUNTIME=rust ./install.sh --uninstall
          LOCALFLOW_RUNTIME=rust ./install.sh --uninstall
          test ! -e "$agent"
          test ! -d "$app"

  # The pinned release tag and its assets only exist after merge, so these
  # checks serve release-shaped assets from a local directory instead
  # (LOCALFLOW_RELEASE_BASE_URL, testing only) and never touch the real release.
  checksum:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Checksum verifier (good hash passes, tampered fails)
        run: python -m pytest -q tests/test_installer_stubs.py
      - name: Release assets are reproducible and pass sha256sum -c
        shell: bash
        run: |
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' pyproject.toml | head -n 1)"
          work="$RUNNER_TEMP/release-check"
          git clone -q . "$work"
          cd "$work"
          git tag -f "v$version" HEAD
          scripts/release-assets.sh "v$version"
          cp dist/release/SHA256SUMS "$RUNNER_TEMP/first.sums"
          scripts/release-assets.sh "v$version"
          cmp "$RUNNER_TEMP/first.sums" dist/release/SHA256SUMS
          cd dist/release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c SHA256SUMS
          else
            shasum -a 256 -c SHA256SUMS
          fi
          tar -tzf "localflow-$version.tar.gz" > "$RUNNER_TEMP/tar-list.txt"
          grep -Fxq "localflow-$version/install.sh" "$RUNNER_TEMP/tar-list.txt"
          unzip -Z1 "localflow-$version.zip" > "$RUNNER_TEMP/zip-list.txt"
          grep -Fxq "localflow-$version/install.sh" "$RUNNER_TEMP/zip-list.txt"

  install:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Linux audio
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
      - name: Install and verify on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./install.sh --no-launch
          test -f "$HOME/.local/share/applications/localflow-setup.desktop"
          if command -v desktop-file-validate >/dev/null 2>&1; then
            desktop-file-validate "$HOME/.local/share/applications/localflow-setup.desktop"
          fi
          "$HOME/.local/bin/lf" --help
          .venv/bin/lf models list
      - name: Install and verify on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./install.sh --no-launch
          test -f "$HOME/Applications/LocalFlow Setup.app/Contents/Info.plist"
          .venv/bin/lf --help
      - name: Install and verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -File install.ps1 -NoLaunch
          $startMenu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\LocalFlow'
          if (-not (Test-Path (Join-Path $startMenu 'LocalFlow.lnk'))) {
            throw 'LocalFlow Start Menu shortcut is missing.'
          }
          if (-not (Test-Path (Join-Path $startMenu 'LocalFlow Setup.lnk'))) {
            throw 'LocalFlow Setup Start Menu shortcut is missing.'
          }
          & .\.venv\Scripts\lf.exe --help
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Checksum verifier on Windows (good hash passes, tampered fails)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = [regex]::Match((Get-Content install.ps1 -Raw), "\`$LocalflowRelease = '(v[^']+)'").Groups[1].Value
          if (-not $release) { throw 'Could not read $LocalflowRelease from install.ps1.' }
          $version = $release.Substring(1)
          $asset = "localflow-$version.zip"
          $work = Join-Path $env:RUNNER_TEMP 'checksum'
          $assets = Join-Path $work 'release'
          $source = Join-Path $work "src\localflow-$version"
          $runner = Join-Path $work 'runner'
          New-Item -ItemType Directory -Force -Path $assets, $source, $runner | Out-Null
          # Run a copy outside the checkout so install.ps1 takes the piped path.
          Copy-Item install.ps1 $runner
          @(
            '[build-system]'
            'requires = ["setuptools>=61"]'
            'build-backend = "setuptools.build_meta"'
            '[project]'
            'name = "localflow"'
            'version = "0.0.0"'
            '[tool.setuptools]'
            'packages = []'
          ) | Set-Content (Join-Path $source 'pyproject.toml')
          $zip = Join-Path $assets $asset
          Compress-Archive -Path $source -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content (Join-Path $assets 'SHA256SUMS')

          $pwshPath = (Get-Command pwsh).Source
          $server = Start-Process python -PassThru -WindowStyle Hidden -ArgumentList @(
            '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $assets
          )
          try {
            $ready = $false
            foreach ($attempt in 1..30) {
              try {
                $null = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8765/SHA256SUMS'
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) { throw 'Local release server did not start.' }

            # Hide git so the installer downloads the release zip.
            $env:PATH = ($env:PATH -split ';' | Where-Object {
              $_ -and -not (Test-Path (Join-Path $_ 'git.exe'))
            }) -join ';'
            if (Get-Command git -ErrorAction SilentlyContinue) { throw 'git is still on PATH.' }
            $env:LOCALFLOW_RELEASE_BASE_URL = 'http://127.0.0.1:8765'
            Remove-Item Env:LOCALFLOW_REF -ErrorAction SilentlyContinue

            # Tampered archive: must fail closed and create nothing.
            $env:LOCALFLOW_HOME = Join-Path $work 'tampered-home'
            $original = [IO.File]::ReadAllBytes($zip)
            [IO.File]::WriteAllBytes($zip, $original + [byte[]](0x74, 0x61, 0x6d, 0x70))
            & $pwshPath -NoProfile -File (Join-Path $runner 'install.ps1') -NoLaunch
            if ($LASTEXITCODE -eq 0) { throw 'install.ps1 accepted a tampered archive.' }
            if (Test-Path $env:LOCALFLOW_HOME) { throw 'Tampered install created LOCALFLOW_HOME.' }

            # Good archive: must verify and install.
            [IO.File]::WriteAllBytes($zip, $original)
            $env:LOCALFLOW_HOME = Join-Path $work 'good-home'
            $output = & $pwshPath -NoProfile -File (Join-Path $runner 'install.ps1') -NoLaunch *>&1 | Out-String
            Write-Host $output
            if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed on a good archive ($LASTEXITCODE)." }
            if ($output -notmatch [regex]::Escape("Verified SHA-256 of $asset.")) {
              throw 'install.ps1 did not report a verified archive.'
            }
            if (-not (Test-Path (Join-Path $env:LOCALFLOW_HOME 'pyproject.toml'))) {
              throw 'Good install did not populate LOCALFLOW_HOME.'
            }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

  piped:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      LOCALFLOW_REPO_URL: ${{ github.workspace }}
      LOCALFLOW_REF: ${{ github.sha }}
      LOCALFLOW_NO_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-venv python3-tk libportaudio2 ffmpeg xdotool libnotify-bin pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
      - name: Install from piped shell script
        if: runner.os == 'Linux'
        shell: bash
        env:
          LOCALFLOW_HOME: ${{ runner.temp }}/lfhome
        run: |
          cat install.sh | bash -s -- --no-system-deps
          "$LOCALFLOW_HOME/.venv/bin/lf" --help
      - name: Install from piped PowerShell script
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LOCALFLOW_HOME: ${{ runner.temp }}/lfhome
        run: |
          Get-Content install.ps1 -Raw | Invoke-Expression
          & "$env:LOCALFLOW_HOME\.venv\Scripts\lf.exe" --help
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
