name: Installers

on:
  push:
    paths:
      - install.sh
      - install.ps1
      - pyproject.toml
      - .github/workflows/installers.yml
  pull_request:
    paths:
      - install.sh
      - install.ps1
      - pyproject.toml
      - .github/workflows/installers.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check install.sh
        run: shellcheck install.sh

  install:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install and verify on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./install.sh --no-launch
          test -f "$HOME/.local/share/applications/localflow-setup.desktop"
          if command -v desktop-file-validate >/dev/null 2>&1; then
            desktop-file-validate "$HOME/.local/share/applications/localflow-setup.desktop"
          fi
          "$HOME/.local/bin/lf" --help
          .venv/bin/lf models list
      - name: Install and verify on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./install.sh --no-launch
          test -f "$HOME/Applications/LocalFlow Setup.app/Contents/Info.plist"
          .venv/bin/lf --help
      - name: Install and verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -File install.ps1 -NoLaunch
          $startMenu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\LocalFlow'
          if (-not (Test-Path (Join-Path $startMenu 'LocalFlow.lnk'))) {
            throw 'LocalFlow Start Menu shortcut is missing.'
          }
          if (-not (Test-Path (Join-Path $startMenu 'LocalFlow Setup.lnk'))) {
            throw 'LocalFlow Setup Start Menu shortcut is missing.'
          }
          & .\.venv\Scripts\lf.exe --help
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  piped:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      LOCALFLOW_HOME: ${{ runner.temp }}/lfhome
      LOCALFLOW_REPO_URL: ${{ github.workspace }}
      LOCALFLOW_REF: ${{ github.sha }}
      LOCALFLOW_NO_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-venv python3-tk libportaudio2 ffmpeg xdotool libnotify-bin pulseaudio-utils
      - name: Install from piped shell script
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cat install.sh | bash -s -- --no-system-deps
          "$LOCALFLOW_HOME/.venv/bin/lf" --help
      - name: Install from piped PowerShell script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content install.ps1 -Raw | Invoke-Expression
          & "$env:LOCALFLOW_HOME\.venv\Scripts\lf.exe" --help
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
