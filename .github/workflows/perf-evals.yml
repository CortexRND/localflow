name: Perf evals

# Tiers of docs/plans/PLAN-perf-evals.md §7-§8:
#   smoke   (PRs, dispatch tier=smoke): same-runner A/B of the merge-base
#           against the PR, one sticky PR comment, artifacts + step summary.
#   nightly (schedule on main, dispatch tier=nightly): full matrix on
#           ubuntu/macos/windows; publish-trend appends the results to the
#           orphan perf-data branch, renders trend.md and opens/updates/closes
#           perf-regression issues for regressions persisting 2 runs.
#   deep    (dispatch tier=deep): large models and 10k recall on macOS.
# rust-bench.yml and the rust.yml memory job keep running alongside this.

on:
  pull_request:
    paths:
      - 'localflow/**'
      - 'rust/**'
      - 'evals/**'
      - '.github/workflows/perf-evals.yml'
  schedule:
    - cron: '0 7 * * *' # nightly, on the default branch (main)
  workflow_dispatch:
    inputs:
      tier:
        description: 'Tier to run (smoke, nightly, deep)'
        required: false
        type: choice
        options: [smoke, nightly, deep]
        default: smoke
      suites:
        description: 'Comma-separated suites to run (smoke only; nightly/deep use their tier matrix)'
        required: false
        default: 'stt'
      runtimes:
        description: 'Comma-separated runtimes (python, rust)'
        required: false
        default: 'python,rust'

permissions:
  contents: read
  pull-requests: write # sticky comment; only used on same-repo PRs

concurrency:
  group: perf-evals-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      HF_HUB_CACHE: ${{ github.workspace }}/.hf-cache/hub
      LF_PERF_CORPUS_CACHE: ${{ github.workspace }}/.perf-cache/corpus
      # evals/perf/corpus/download.py reads LF_PERF_CACHE_DIR (clips land in <dir>/stt).
      LF_PERF_CACHE_DIR: ${{ github.workspace }}/.perf-cache/corpus
      PYNPUT_BACKEND: dummy
      # Untrusted inputs go through env, never straight into a script.
      # diarization is safe here: its mock cases carry only deterministic quality
      # metrics, and the sherpa cases are not_exercised (plain `pip install -e .`).
      PERF_SUITES_INPUT: ${{ inputs.suites || 'stt,dictation,recall,diarization' }}
      PERF_RUNTIMES_INPUT: ${{ inputs.runtimes || 'python,rust' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # test-merge commit + baseline worktree for the same-runner A/B

      # ffmpeg decodes the FLAC corpus; the rest is what rust.yml installs to
      # build lf-stt (cpal: ALSA, whisper-rs: CMake + libclang) and import localflow.
      - name: Install ffmpeg and build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg pkg-config libasound2-dev cmake libclang-dev libportaudio2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: perf-hf-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Cache perf corpus
        uses: actions/cache@v4
        with:
          path: .perf-cache
          key: perf-corpus-v1-${{ hashFiles('evals/perf/corpus/*.json') }}

      - name: Select suites and runtimes
        shell: bash
        run: |
          set -euo pipefail
          suites="$(printf '%s' "$PERF_SUITES_INPUT" | tr -d ' ')"
          if ! printf '%s' "$suites" | grep -Eq '^[a-z_]+(,[a-z_]+)*$'; then
            echo "::error::invalid suites input: $suites"; exit 2
          fi
          runtimes=""
          for rt in $(printf '%s' "$PERF_RUNTIMES_INPUT" | tr ',' ' '); do
            case "$rt" in
              python|rust) runtimes="$runtimes $rt" ;;
              *) echo "::error::invalid runtime: $rt (python, rust)"; exit 2 ;;
            esac
          done
          [ -n "$runtimes" ] || { echo "::error::no runtimes selected"; exit 2; }
          echo "PERF_SUITES=$suites" >> "$GITHUB_ENV"
          echo "PERF_RUNTIMES=${runtimes# }" >> "$GITHUB_ENV"
          mkdir -p perf-results

      - name: Install Python dependencies (candidate)
        run: pip install -e .

      - name: Restore native runtimes pruned by Rust cache
        shell: bash
        run: |
          if [ -d rust/target/sherpa-onnx-prebuilt ]; then
            find rust/target/sherpa-onnx-prebuilt -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          fi
          cargo clean --manifest-path rust/Cargo.toml -p sherpa-onnx-sys --release

      - name: Build candidate stt_bench
        if: contains(env.PERF_RUNTIMES, 'rust')
        run: cargo build --manifest-path rust/Cargo.toml --locked --release -p lf-stt --example stt_bench

      - name: Build candidate parity (dictation text pipeline)
        if: contains(env.PERF_RUNTIMES, 'rust') && contains(env.PERF_SUITES, 'dictation')
        run: cargo build --manifest-path rust/Cargo.toml --locked --release -p lf --example parity

      - name: Build candidate bench_search (recall)
        if: contains(env.PERF_RUNTIMES, 'rust') && contains(env.PERF_SUITES, 'recall')
        run: cargo build --manifest-path rust/Cargo.toml --locked --release -p lf-ask --example bench_search

      - name: Warm model cache on cold miss
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -d "$HF_HUB_CACHE" ] || [ -z "$(ls -A "$HF_HUB_CACHE" 2>/dev/null)" ]; then
            echo "Cold HF cache detected; warming smoke models before timed A/B runs"
            for rt in $PERF_RUNTIMES; do
              python -m evals.perf run --tier smoke --runtime "$rt" --suite "$PERF_SUITES" \
                --runner-label ubuntu-latest --output /dev/null || true
            done
          fi

      - name: Run candidate smoke suites
        shell: bash
        run: |
          set -uo pipefail
          for rt in $PERF_RUNTIMES; do
            python -m evals.perf run --tier smoke --runtime "$rt" --suite "$PERF_SUITES" \
              --runner-label ubuntu-latest --output "perf-results/candidate-$rt.json" \
              || echo "::warning::candidate $rt run exited $?"
          done

      # Baseline = merge-base, measured on this same runner with the
      # candidate's evals/perf harness overlaid, so only product code differs.
      - name: Same-runner A/B baseline (merge-base)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -uo pipefail
          results="$GITHUB_WORKSPACE/perf-results"
          baseline="$(cd "$GITHUB_WORKSPACE/.." && pwd)/perf-baseline"
          if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            base_sha="$(git rev-parse HEAD^1)"
          else
            base_sha="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)" || {
              for rt in $PERF_RUNTIMES; do
                echo "Could not compute merge-base with origin/${GITHUB_BASE_REF}; candidate-only." > "$results/note-$rt.txt"
              done
              exit 0
            }
          fi
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          echo "Baseline: $base_sha"
          git worktree remove --force ../perf-baseline 2>/dev/null || true
          if ! git worktree add --detach ../perf-baseline "$base_sha"; then
            for rt in $PERF_RUNTIMES; do
              echo "Could not create a worktree at merge-base ${base_sha:0:12}; candidate-only." > "$results/note-$rt.txt"
            done
            exit 0
          fi
          rm -rf "$baseline/evals/perf"
          mkdir -p "$baseline/evals"
          cp -R evals/perf "$baseline/evals/perf"
          find "$baseline/evals/perf" -name __pycache__ -type d -prune -exec rm -rf {} +

          for rt in $PERF_RUNTIMES; do
            note="$results/note-$rt.txt"
            out="$results/baseline-$rt.json"
            case "$rt" in
              python)
                if ! grep -q '^class Transcriber' "$baseline/localflow/stt.py" 2>/dev/null; then
                  echo "Bootstrap: merge-base ${base_sha:0:12} has no localflow.stt.Transcriber; no Python baseline." > "$note"
                  continue
                fi
                origin="$(cd "$baseline" && PYTHONPATH="$baseline" python -c 'import localflow; print(localflow.__file__)' 2>/dev/null || true)"
                case "$origin" in
                  "$baseline"/*) ;;
                  *) echo "Could not import the merge-base localflow (got '${origin:-nothing}'); no Python baseline." > "$note"; continue ;;
                esac
                (cd "$baseline" && python -m evals.perf run --tier smoke --runtime python --suite "$PERF_SUITES" \
                  --runner-label ubuntu-latest --output "$out") \
                  || echo "Baseline Python run at ${base_sha:0:12} exited non-zero." > "$note"
                ;;
              rust)
                if ! grep -Eq 'manifest: *Option<' "$baseline/rust/lf-stt/examples/stt_bench.rs" 2>/dev/null; then
                  echo "Bootstrap: merge-base ${base_sha:0:12} stt_bench has no --manifest; no Rust baseline." > "$note"
                  continue
                fi
                # Share the target dir so registry deps are reused; the candidate
                # binary has already been measured, so overwriting it is fine.
                if ! CARGO_TARGET_DIR="$GITHUB_WORKSPACE/rust/target" cargo build \
                    --manifest-path "$baseline/rust/Cargo.toml" --locked --release -p lf-stt --example stt_bench; then
                  echo "Baseline stt_bench at ${base_sha:0:12} failed to build; no Rust baseline." > "$note"
                  continue
                fi
                parity_env=""
                if printf ',%s,' "$PERF_SUITES" | grep -q ',dictation,'; then
                  if CARGO_TARGET_DIR="$GITHUB_WORKSPACE/rust/target" cargo build \
                      --manifest-path "$baseline/rust/Cargo.toml" --locked --release -p lf --example parity; then
                    parity_env="$GITHUB_WORKSPACE/rust/target/release/examples/parity"
                  fi
                fi
                recall_env=""
                if printf ',%s,' "$PERF_SUITES" | grep -q ',recall,'; then
                  if grep -q -- '--queries' "$baseline/rust/lf-ask/examples/bench_search.rs" 2>/dev/null \
                      && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/rust/target" cargo build \
                        --manifest-path "$baseline/rust/Cargo.toml" --locked --release -p lf-ask --example bench_search; then
                    recall_env="$GITHUB_WORKSPACE/rust/target/release/examples/bench_search"
                  fi
                fi
                (cd "$baseline" && LF_PERF_STT_BENCH_BIN="$GITHUB_WORKSPACE/rust/target/release/examples/stt_bench" \
                  LF_PERF_PARITY_BIN="$parity_env" \
                  LF_PERF_RECALL_BIN="$recall_env" \
                  python -m evals.perf run --tier smoke --runtime rust --suite "$PERF_SUITES" \
                  --runner-label ubuntu-latest --output "$out") \
                  || echo "Baseline Rust run at ${base_sha:0:12} exited non-zero." > "$note"
                ;;
            esac
          done
          exit 0

      - name: Remove baseline worktree
        if: always() && github.event_name == 'pull_request'
        run: git worktree remove --force ../perf-baseline || true

      - name: Compare and combine
        if: always()
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          mkdir -p perf-results
          args=()
          for rt in ${PERF_RUNTIMES:-python rust}; do
            entry="runtime=$rt,candidate=perf-results/candidate-$rt.json"
            if [ -f "perf-results/baseline-$rt.json" ] && [ -f "perf-results/candidate-$rt.json" ]; then
              rc=0
              python -m evals.perf compare \
                --baseline "perf-results/baseline-$rt.json" --candidate "perf-results/candidate-$rt.json" \
                --output "perf-results/report-$rt.md" --json "perf-results/compare-$rt.json" > /dev/null || rc=$?
              echo "compare $rt exit code: $rc"
              entry="$entry,compare=perf-results/compare-$rt.json,report=perf-results/report-$rt.md"
            elif [ ! -f "perf-results/note-$rt.txt" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
              echo "$GITHUB_EVENT_NAME run: no merge-base baseline; candidate-only." > "perf-results/note-$rt.txt"
            fi
            if [ -f "perf-results/note-$rt.txt" ]; then
              entry="$entry,note_file=perf-results/note-$rt.txt"
            fi
            args+=(--entry "$entry")
          done
          python -m evals.perf.ci_report --output perf-results/report.md \
            --sha "$HEAD_SHA" --base-sha "${BASE_SHA:-}" \
            --status-json perf-results/status.json --no-fail "${args[@]}" > /dev/null
          cat perf-results/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-${{ runner.os }}-${{ runner.arch }}
          path: perf-results/
          if-no-files-found: warn

      # Fork PRs get a read-only token, so only comment on same-repo PRs.
      - name: Sticky PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- lf-perf-smoke-report -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            try {
              body = fs.readFileSync('perf-results/report.md', 'utf8');
            } catch (err) {
              body = `${marker}\n## ❌ Perf smoke: report missing\n\nThe combine step did not produce a report; see the run logs.\n`;
            }
            if (!body.includes(marker)) body = `${marker}\n${body}`;
            body += `\n<sub>[Workflow run](${runUrl})</sub>\n`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user && c.user.type === 'Bot' && (c.body || '').includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Gate on perf status
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          path = Path("perf-results/status.json")
          if not path.is_file():
              sys.exit("perf-results/status.json missing: combine step did not run")
          status = json.loads(path.read_text(encoding="utf-8"))
          print(f"perf smoke status: {status.get('status')} (exit_code {status.get('exit_code')})")
          sys.exit(1 if status.get("exit_code", 1) != 0 else 0)
          PY

  # ------------------------------------------------------------------------
  # Nightly tier: full suite matrix per OS (windows: stt + dictation, §7).
  # ------------------------------------------------------------------------
  nightly:
    name: nightly (${{ matrix.os }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'nightly')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suites: stt,dictation,recall,footprint,meetings,diarization
          - os: macos-latest
            suites: stt,dictation,recall,footprint
          - os: windows-latest
            suites: stt,dictation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      HF_HUB_CACHE: ${{ github.workspace }}/.hf-cache/hub
      LF_PERF_CORPUS_CACHE: ${{ github.workspace }}/.perf-cache/corpus
      LF_PERF_CACHE_DIR: ${{ github.workspace }}/.perf-cache/corpus
      PYNPUT_BACKEND: dummy
      PERF_SUITES: ${{ matrix.suites }}
      PERF_RUNNER: ${{ matrix.os }}
      # Untrusted inputs go through env, never straight into a script.
      PERF_RUNTIMES_INPUT: ${{ inputs.runtimes || 'python,rust' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg pkg-config libasound2-dev cmake libclang-dev libportaudio2

      - name: Ensure ffmpeg
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            case "$RUNNER_OS" in
              macOS) brew install ffmpeg ;;
              Windows) choco install ffmpeg -y --no-progress ;;
            esac
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: perf-nightly

      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: .hf-cache
          # v2: the first run after the diarization suite saves a cache that also
          # holds the speaker models (an exact-key hit is never re-saved).
          key: perf-hf-v2-${{ runner.os }}-${{ runner.arch }}

      - name: Cache perf corpus
        uses: actions/cache@v4
        with:
          path: .perf-cache
          key: perf-corpus-v1-${{ hashFiles('evals/perf/corpus/*.json') }}

      - name: Select runtimes
        shell: bash
        run: |
          set -euo pipefail
          runtimes=""
          for rt in $(printf '%s' "$PERF_RUNTIMES_INPUT" | tr ',' ' '); do
            case "$rt" in
              python|rust) runtimes="$runtimes $rt" ;;
              *) echo "::error::invalid runtime: $rt (python, rust)"; exit 2 ;;
            esac
          done
          [ -n "$runtimes" ] || { echo "::error::no runtimes selected"; exit 2; }
          echo "PERF_RUNTIMES=${runtimes# }" >> "$GITHUB_ENV"
          mkdir -p perf-results

      - name: Install Python dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            pip install -e ".[mlx]"
          elif printf ',%s,' "$PERF_SUITES" | grep -q ',diarization,'; then
            pip install -e ".[diarization]"
          else
            pip install -e .
          fi

      # Speaker models land in HF_HUB_CACHE (.hf-cache/hub). Without them the
      # sherpa diarization cases are not_exercised, never failed.
      - name: Download speaker models
        if: contains(matrix.suites, 'diarization')
        shell: bash
        run: lf speakers download || echo "::warning::speaker model download failed; diarization cases will be not_exercised"

      - name: Restore native runtimes pruned by Rust cache
        shell: bash
        run: |
          if [ -d rust/target/sherpa-onnx-prebuilt ]; then
            find rust/target/sherpa-onnx-prebuilt -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          fi
          cargo clean --manifest-path rust/Cargo.toml -p sherpa-onnx-sys --release
          # Cached whisper-rs-sys CMake output can pin an older runner's MSVC path.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo clean --manifest-path rust/Cargo.toml -p whisper-rs-sys --release
          fi

      # A failed build leaves that suite's Rust cases not_exercised instead of
      # aborting the other suites on this OS.
      - name: Build Rust benches
        if: contains(env.PERF_RUNTIMES, 'rust')
        shell: bash
        run: |
          set -uo pipefail
          has() { printf ',%s,' "$PERF_SUITES" | grep -q ",$1,"; }
          build() { cargo build --manifest-path rust/Cargo.toml --locked --release "$@" || echo "::warning::cargo build $* failed"; }
          if has stt; then build -p lf-stt --example stt_bench; fi
          if has dictation; then build -p lf --example parity; fi
          if has recall; then build -p lf-ask --example bench_search; fi
          if has footprint && [ "$RUNNER_OS" = "Linux" ]; then
            # idle.rs reads /proc: Linux only.
            build -p lf-runtime --example idle
          fi
          if has dictation || has footprint; then
            build -p lf --bin lf-rs
          fi
          exit 0

      - name: Run nightly suites
        shell: bash
        run: |
          set -uo pipefail
          for rt in $PERF_RUNTIMES; do
            python -m evals.perf run --tier nightly --runtime "$rt" --suite "$PERF_SUITES" \
              --runner-label "$PERF_RUNNER" --output "perf-results/nightly-$PERF_RUNNER-$rt.json" \
              || echo "::warning::nightly $rt run exited $?"
          done

      - name: Step summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          args=()
          for f in perf-results/nightly-*.json; do
            if [ -f "$f" ]; then args+=(--append "$f"); fi
          done
          if [ ${#args[@]} -eq 0 ]; then
            echo "## ❌ Perf nightly ($PERF_RUNNER): no results" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m evals.perf trend --store .perf-summary-store "${args[@]}" \
            --output perf-results/summary.md
          { echo "## Perf nightly ($PERF_RUNNER)"; head -c 900000 perf-results/summary.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-nightly-${{ matrix.os }}
          path: perf-results/
          if-no-files-found: warn

  # ------------------------------------------------------------------------
  # Trend store on the orphan perf-data branch: the only job that writes.
  # ------------------------------------------------------------------------
  publish-trend:
    needs: nightly
    if: always() && (github.event_name == 'schedule' || inputs.tier == 'nightly') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push to the orphan perf-data branch
      issues: write # open/update/close perf-regression issues
    concurrency:
      group: perf-data-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # The trend/regression tooling is stdlib-only: no pip install needed.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download nightly results
        uses: actions/download-artifact@v4
        with:
          pattern: perf-nightly-*
          path: nightly-results

      - name: Check out perf-data branch
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin perf-data >/dev/null 2>&1; then
            git fetch --depth=1 origin perf-data:refs/remotes/origin/perf-data
            git worktree add -B perf-data perf-data-store origin/perf-data
          else
            echo "perf-data does not exist yet; creating it as an orphan branch"
            git worktree add --detach perf-data-store HEAD
            cd perf-data-store
            git checkout --orphan perf-data
            git rm -rfq --ignore-unmatch .
            git clean -fdxq
            printf '%s\n' '# perf-data' '' \
              'Nightly perf trend store written by .github/workflows/perf-evals.yml (publish-trend).' \
              'runs/: lf-perf-result/v1 files; index.jsonl: one line per (run, case); trend.md: rendered trend.' \
              > README.md
          fi

      - name: Append results and render trend.md
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p perf-results
          shopt -s nullglob
          files=(nightly-results/*/nightly-*.json)
          if [ ${#files[@]} -eq 0 ]; then echo "::warning::no nightly result files downloaded"; fi
          for f in "${files[@]}"; do
            python -m evals.perf trend-append --store perf-data-store --result "$f" \
              || echo "::warning::could not append $f"
          done
          python -m evals.perf trend --index perf-data-store/index.jsonl --tier nightly \
            --output perf-data-store/trend.md
          head -c 900000 perf-data-store/trend.md >> "$GITHUB_STEP_SUMMARY"

      - name: Push perf-data
        shell: bash
        working-directory: perf-data-store
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "perf-data unchanged"
            exit 0
          fi
          git commit -q -m "perf-data: nightly ${GITHUB_SHA::12} (run ${GITHUB_RUN_ID})"
          git push origin HEAD:refs/heads/perf-data

      - name: Detect consecutive regressions
        shell: bash
        run: |
          python -m evals.perf regressions --index perf-data-store/index.jsonl \
            --policy evals/perf/policy.toml --consecutive 2 --output perf-results/regressions.json

      - name: Sync perf-regression issues
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m evals.perf.regression_issues --report perf-results/regressions.json \
            --repo "$GITHUB_REPOSITORY" --output perf-results/issue-actions.json

      - name: Upload trend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-trend
          path: |
            perf-results/
            perf-data-store/trend.md
          if-no-files-found: warn

  # ------------------------------------------------------------------------
  # Deep tier (manual only): large models, 10k recall on macOS.
  # ------------------------------------------------------------------------
  deep:
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'deep'
    runs-on: macos-latest
    timeout-minutes: 240
    env:
      CARGO_TERM_COLOR: always
      HF_HUB_CACHE: ${{ github.workspace }}/.hf-cache/hub
      LF_PERF_CORPUS_CACHE: ${{ github.workspace }}/.perf-cache/corpus
      LF_PERF_CACHE_DIR: ${{ github.workspace }}/.perf-cache/corpus
      PYNPUT_BACKEND: dummy
      PERF_SUITES: stt,dictation,recall,footprint
      PERF_RUNNER: macos-latest
      # Untrusted inputs go through env, never straight into a script.
      PERF_RUNTIMES_INPUT: ${{ inputs.runtimes || 'python,rust' }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure ffmpeg
        shell: bash
        run: command -v ffmpeg >/dev/null || brew install ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: perf-deep

      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: perf-hf-deep-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Cache perf corpus
        uses: actions/cache@v4
        with:
          path: .perf-cache
          key: perf-corpus-v1-${{ hashFiles('evals/perf/corpus/*.json') }}

      - name: Select runtimes
        shell: bash
        run: |
          set -euo pipefail
          runtimes=""
          for rt in $(printf '%s' "$PERF_RUNTIMES_INPUT" | tr ',' ' '); do
            case "$rt" in
              python|rust) runtimes="$runtimes $rt" ;;
              *) echo "::error::invalid runtime: $rt (python, rust)"; exit 2 ;;
            esac
          done
          [ -n "$runtimes" ] || { echo "::error::no runtimes selected"; exit 2; }
          echo "PERF_RUNTIMES=${runtimes# }" >> "$GITHUB_ENV"
          mkdir -p perf-results

      - name: Install Python dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            pip install -e ".[mlx]"
          else
            pip install -e .
          fi

      - name: Restore native runtimes pruned by Rust cache
        shell: bash
        run: |
          if [ -d rust/target/sherpa-onnx-prebuilt ]; then
            find rust/target/sherpa-onnx-prebuilt -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          fi
          cargo clean --manifest-path rust/Cargo.toml -p sherpa-onnx-sys --release

      - name: Build Rust benches
        if: contains(env.PERF_RUNTIMES, 'rust')
        shell: bash
        run: |
          set -uo pipefail
          build() { cargo build --manifest-path rust/Cargo.toml --locked --release "$@" || echo "::warning::cargo build $* failed"; }
          build -p lf-stt --example stt_bench
          build -p lf --example parity
          build -p lf-ask --example bench_search
          build -p lf --bin lf-rs
          exit 0

      - name: Run deep suites
        shell: bash
        run: |
          set -uo pipefail
          for rt in $PERF_RUNTIMES; do
            python -m evals.perf run --tier deep --runtime "$rt" --suite "$PERF_SUITES" \
              --runner-label "$PERF_RUNNER" --output "perf-results/deep-$PERF_RUNNER-$rt.json" \
              || echo "::warning::deep $rt run exited $?"
          done

      - name: Step summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          args=()
          for f in perf-results/deep-*.json; do
            if [ -f "$f" ]; then args+=(--append "$f"); fi
          done
          if [ ${#args[@]} -eq 0 ]; then
            echo "## ❌ Perf deep ($PERF_RUNNER): no results" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m evals.perf trend --store .perf-summary-store "${args[@]}" \
            --output perf-results/summary.md
          { echo "## Perf deep ($PERF_RUNNER)"; head -c 900000 perf-results/summary.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-deep-${{ runner.os }}-${{ runner.arch }}
          path: perf-results/
          if-no-files-found: warn
