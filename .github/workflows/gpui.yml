name: GPUI desktop

# The native GPUI preview (rust/lf-desktop) is a standalone Cargo workspace
# with its own Cargo.lock, kept out of rust/Cargo.toml so the existing Rust
# workflow and its platform matrix are unchanged. Without this workflow
# nothing in CI would build it. Additive only: no other workflow is modified
# and no runtime, installer or launcher behaviour depends on it.
#
# Two builds are checked: the default front end, and `--features runtime`
# (forwards to lf-ui/runtime: native speech engine, model downloads, setup
# trial and the opt-in `--engine`).
on:
  push:
    paths:
      - "rust/lf-desktop/**"
      - "scripts/gpui_data_safety.py"
      - "scripts/gpui_screenshots.py"
      # Path dependencies of lf-desktop (directly, through lf-ui, or through
      # the `runtime` feature's lf-ui/runtime and lf-stt).
      - "rust/lf-core/**"
      - "rust/lf-ui/**"
      - "rust/lf-providers/**"
      - "rust/lf-audio/**"
      - "rust/lf-agent/**"
      - "rust/lf-runtime/**"
      - "rust/lf-input/**"
      - "rust/lf-server/**"
      - "rust/lf-stt/**"
      - "rust/lf-meetings/**"
      - "rust/lf-meetings-backend/**"
      - "rust/lf-ask/**"
      # workspace.package / workspace.dependencies inherited by those crates.
      - "rust/Cargo.toml"
      - "scripts/run_gpui.sh"
      - ".github/workflows/gpui.yml"
  pull_request:
    paths:
      - "rust/lf-desktop/**"
      - "scripts/gpui_data_safety.py"
      - "scripts/gpui_screenshots.py"
      # Path dependencies of lf-desktop (directly, through lf-ui, or through
      # the `runtime` feature's lf-ui/runtime and lf-stt).
      - "rust/lf-core/**"
      - "rust/lf-ui/**"
      - "rust/lf-providers/**"
      - "rust/lf-audio/**"
      - "rust/lf-agent/**"
      - "rust/lf-runtime/**"
      - "rust/lf-input/**"
      - "rust/lf-server/**"
      - "rust/lf-stt/**"
      - "rust/lf-meetings/**"
      - "rust/lf-meetings-backend/**"
      - "rust/lf-ask/**"
      # workspace.package / workspace.dependencies inherited by those crates.
      - "rust/Cargo.toml"
      - "scripts/run_gpui.sh"
      - ".github/workflows/gpui.yml"

permissions:
  contents: read

concurrency:
  group: gpui-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MANIFEST: rust/lf-desktop/Cargo.toml

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # whisper-rs (runtime feature) needs CMake and libclang.
      - name: GPUI and audio system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev pkg-config \
            libasound2-dev libfontconfig1-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev libzstd-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/lf-desktop
      # rust-cache prunes the sherpa SDK copied next to the build output;
      # rebuild the sys crate so it is restored (same as rust.yml).
      - name: Restore native runtimes pruned by Rust cache
        shell: bash
        run: |
          if [ -d rust/lf-desktop/target/sherpa-onnx-prebuilt ]; then
            find rust/lf-desktop/target/sherpa-onnx-prebuilt -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          fi
          cargo clean --manifest-path "$MANIFEST" -p sherpa-onnx-sys
      - name: Format
        run: cargo fmt --manifest-path "$MANIFEST" --all -- --check
      - name: Clippy (default build)
        run: cargo clippy --manifest-path "$MANIFEST" --workspace --all-targets --locked -- -D warnings
      - name: Tests (default build; headless; includes the xattr shim)
        run: cargo test --manifest-path "$MANIFEST" --workspace --locked
      - name: Build lf-desktop (default build)
        run: cargo build --manifest-path "$MANIFEST" --locked --bin lf-desktop
      - name: Clippy (runtime feature)
        run: cargo clippy --manifest-path "$MANIFEST" --workspace --all-targets --features runtime --locked -- -D warnings
      - name: Tests (runtime feature; headless, no audio, keyboard hook or downloads)
        run: cargo test --manifest-path "$MANIFEST" --workspace --features runtime --locked
      - name: Build lf-desktop (runtime feature)
        run: cargo build --manifest-path "$MANIFEST" --locked --features runtime --bin lf-desktop
      - name: Install cutover gate tools
        id: cutover-deps
        run: |
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth x11-utils xdotool openbox imagemagick mesa-vulkan-drivers \
            dbus-x11 gnome-keyring libsecret-tools python3-dbus python3-gi
      - name: Gate 2 — sandbox data safety
        env:
          RUST_LOG: error
        run: |
          export HOME="$(mktemp -d "$RUNNER_TEMP/gpui-home.XXXXXX")"
          export XDG_CONFIG_HOME="$HOME/.config" XDG_DATA_HOME="$HOME/.local/share"
          export XDG_RUNTIME_DIR="$HOME" LOCALFLOW_CONFIG=""
          mkdir -p "$XDG_CONFIG_HOME/localflow" "$HOME/.localflow"
          printf '# Gate 2 fixture\n' > "$XDG_CONFIG_HOME/localflow/config.toml"
          printf 'gate2-fixture-token\n' > "$XDG_CONFIG_HOME/localflow/api-token"
          printf '{"words": [], "replacements": {}}\n' > "$HOME/.localflow/dictionary.json"
          dbus-run-session -- bash -e -o pipefail -c '
            printf %s cutover-fixture | gnome-keyring-daemon --unlock --components=secrets
            printf %s cutover-fixture | timeout 10 secret-tool store \
              --label="Cutover fixture" service localflow username cutover_fixture
            xvfb-run -a -s "-screen 0 1600x1000x24 -dpi 96" /usr/bin/python3 \
              scripts/gpui_data_safety.py rust/lf-desktop/target/debug/lf-desktop artifacts/gpui-data-safety
          '
      - name: Gate 8 — sandbox screenshot matrix
        if: ${{ !cancelled() && steps.cutover-deps.outcome == 'success' }}
        env:
          RUST_LOG: error
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1000x24 -dpi 96 -extension Composite' \
            /usr/bin/python3 scripts/gpui_screenshots.py rust/lf-desktop/target/debug/lf-desktop artifacts/gpui-screenshots
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.cutover-deps.outcome == 'success' }}
        with:
          name: gpui-data-safety
          path: artifacts/gpui-data-safety/*.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.cutover-deps.outcome == 'success' }}
        with:
          name: gpui-screenshots
          path: artifacts/gpui-screenshots/*.png

  macos:
    # Verifies the macOS cfg paths (GPUI Metal backend, xattr shim, CGEventTap
    # readiness hook, Metal whisper.cpp) compile. lf-hub stays the macOS app;
    # this job does not package anything or run a runtime.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/lf-desktop
      - name: Restore native runtimes pruned by Rust cache
        shell: bash
        run: |
          if [ -d rust/lf-desktop/target/sherpa-onnx-prebuilt ]; then
            find rust/lf-desktop/target/sherpa-onnx-prebuilt -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          fi
          cargo clean --manifest-path "$MANIFEST" -p sherpa-onnx-sys
      - name: xattr shim tests
        run: cargo test --manifest-path "$MANIFEST" -p xattr@0.2.3 --locked
      - name: Type-check lf-desktop (default build)
        run: cargo check --manifest-path "$MANIFEST" --workspace --all-targets --locked
      - name: Type-check lf-desktop (runtime feature)
        run: cargo check --manifest-path "$MANIFEST" --workspace --all-targets --features runtime --locked

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/lf-desktop
      - name: Type-check lf-desktop and Windows tray
        run: cargo check --manifest-path "$env:MANIFEST" -p lf-desktop --all-targets --locked
