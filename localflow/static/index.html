<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>localflow</title>
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --text: #1a1a1a;
    --muted: #5a5a5a;
    --accent: #0f3d3e;
    --accent-soft: #f0f4f4;
    --alert: #a32222;
    --alert-soft: #fbf3f3;
    --rule: #e0e0dc;
    /* Interactive boundaries need 3:1 against their fill (WCAG 1.4.11).
       --rule is a decorative hairline at 1.23:1 and must not be used on them. */
    --control-border: #767676;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }

  button, input, select {
    font-family: inherit;
    color: inherit;
    border-radius: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .container {
    max-width: 520px;
    margin: 0 auto;
    padding: 40px 20px 56px;
  }

  /* ---- Masthead ---- */
  .masthead {
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 2.5rem;
  }
  .masthead h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin: 0;
  }
  .masthead p {
    font-size: 0.9rem;
    color: var(--muted);
    margin: 0.4rem 0 0;
  }

  /* ---- Sections ---- */
  .section + .section {
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px solid var(--rule);
  }
  .section-label {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
    margin-bottom: 1.25rem;
  }

  /* ---- Primary control ---- */
  #recordBtn {
    position: relative;
    display: block;
    width: 100%;
    min-height: 120px;
    padding: 16px 52px;
    background: var(--accent);
    color: #ffffff;
    border: 1px solid var(--accent);
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    margin-bottom: 1rem;
  }
  #recordBtn:active { opacity: 0.9; }

  #recordBtn.recording {
    background: var(--alert);
    border-color: var(--alert);
    color: #ffffff;
  }
  #recordBtn.recording::before {
    content: "";
    position: absolute;
    left: 20px;
    top: 50%;
    width: 12px;
    height: 12px;
    margin-top: -6px;
    background: #ffffff;
    animation: blink 1.2s ease-in-out infinite;
  }

  #recordBtn.busy,
  #recordBtn:disabled {
    background: #d8d8d4;
    border-color: #c9c9c4;
    color: #3f3f3f;
    cursor: not-allowed;
  }
  #recordBtn.busy::before { content: none; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.15; }
  }

  /* ---- Clean toggle ---- */
  #cleanToggle {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    min-height: 48px;
    font-size: 0.9rem;
    color: var(--muted);
    cursor: pointer;
  }
  #cleanToggle input {
    width: 22px;
    height: 22px;
    flex: 0 0 auto;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* ---- Status & error ---- */
  #status {
    min-height: 1.5em;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 0.5rem;
  }
  #error {
    display: none;
    border: 1px solid var(--alert);
    border-left-width: 3px;
    background: var(--alert-soft);
    color: #7d1a1a;
    padding: 0.85rem 1rem;
    font-size: 0.9rem;
    line-height: 1.45;
    margin-top: 1rem;
  }

  .spinner {
    display: inline-block;
    vertical-align: -3px;
    width: 14px;
    height: 14px;
    margin-right: 0.5rem;
    border: 2px solid var(--rule);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- Meeting ---- */
  .meeting-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .meeting-header h2 {
    font-size: 1rem;
    font-weight: 600;
    margin: 0;
  }
  #meetingWatchState {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--muted);
    text-align: right;
  }

  #meetingBanner {
    display: none;
    border: 1px solid var(--accent);
    border-left-width: 3px;
    background: var(--accent-soft);
    padding: 0.75rem 0.85rem;
    font-size: 0.9rem;
    line-height: 1.4;
    margin-bottom: 1rem;
  }
  .banner-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .dismissBtn,
  .copyBtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 12px;
    background: var(--surface);
    border: 1px solid var(--control-border);
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .dismissBtn { min-width: 88px; flex: 0 0 auto; }
  .dismissBtn:active, .copyBtn:active { background: #f1f1ee; }

  .meetingRow {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .meetingRow input,
  .meetingRow select {
    min-height: 48px;
    padding: 0 0.75rem;
    font-size: 16px;
    background: var(--surface);
    border: 1px solid var(--control-border);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .meetingRow input { flex: 1 1 auto; min-width: 0; }
  .meetingRow select { flex: 0 0 auto; min-width: 116px; }
  /* Safari's UA placeholder colour is ~2.35:1 on white — below AA, and this
     placeholder doubles as the field's only visible label. Set it explicitly. */
  .meetingRow input::placeholder {
    color: var(--muted);
    opacity: 1; /* Firefox dims placeholders by default */
  }

  #meetingBtn {
    position: relative;
    display: block;
    width: 100%;
    min-height: 56px;
    padding: 12px 44px;
    background: var(--surface);
    color: var(--accent);
    border: 1px solid var(--accent);
    font-size: 0.9rem;
    font-weight: 600;
    line-height: 1.3;
    cursor: pointer;
    margin-bottom: 1rem;
  }
  #meetingBtn:active { background: var(--accent-soft); }

  #meetingBtn.live {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }
  #meetingBtn.live::before {
    content: "";
    position: absolute;
    left: 18px;
    top: 50%;
    width: 10px;
    height: 10px;
    margin-top: -5px;
    background: #ffffff;
    animation: blink 1.2s ease-in-out infinite;
  }
  #meetingBtn:disabled {
    background: #d8d8d4;
    border-color: #c9c9c4;
    color: #3f3f3f;
    cursor: not-allowed;
  }
  #meetingBtn:disabled::before { content: none; }

  #meetingLive {
    display: none;
    border: 1px solid var(--rule);
    background: var(--surface);
    padding: 1rem;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    line-height: 1.6;
    max-height: 260px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    white-space: pre-wrap;
    word-wrap: break-word;
    margin-bottom: 1rem;
  }
  #meetingSaved {
    display: none;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--accent);
    line-height: 1.5;
    word-break: break-all;
  }

  /* ---- Transcripts ---- */
  #list:empty::before {
    content: "No transcripts yet.";
    display: block;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .item {
    padding: 1.25rem 0;
    border-top: 1px solid var(--rule);
  }
  .item:first-child { border-top: none; padding-top: 0; }
  .item .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }
  .copyBtn {
    min-width: 84px;
    margin: -10px -4px -10px 0;
    font-family: var(--font-sans);
  }
  .copyBtn.copied {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
    cursor: default;
  }
  .item .text {
    font-size: 1rem;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  /* ---- Colophon ---- */
  .colophon {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.6;
  }
  .colophon p { margin: 0; }
  .colophon code {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--text);
    background: #ecece8;
    padding: 0.1rem 0.3rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .spinner, #recordBtn.recording::before, #meetingBtn.live::before {
      animation: none;
    }
  }
</style>
</head>
<body>

  <div class="container">
    <header class="masthead">
      <h1>localflow</h1>
      <p>Local voice and meeting transcription.</p>
    </header>

    <section class="section" aria-labelledby="sec-voice">
      <div class="section-label" id="sec-voice">Voice</div>

      <button id="recordBtn" type="button">Record</button>

      <label id="cleanToggle">
        <input type="checkbox" id="cleanCheckbox" checked>
        <span>Clean up with Ollama</span>
      </label>

      <div id="status"></div>
      <div id="error"></div>
    </section>

    <section class="section" aria-labelledby="sec-meeting">
      <div class="section-label" id="sec-meeting">Meeting</div>

      <div id="meetingPanel">
        <div class="meeting-header">
          <h2>Meeting transcription</h2>
          <span id="meetingWatchState"></span>
        </div>

        <div id="meetingBanner">
          <div class="banner-inner">
            <span>Meeting detected<span id="meetingPlatform"></span> — start transcribing?</span>
            <button class="dismissBtn" id="meetingDismiss" type="button">Dismiss</button>
          </div>
        </div>

        <div class="meetingRow">
          <input id="meetingTitle" type="text" placeholder="Meeting title"
                 aria-label="Meeting title">
          <select id="meetingCategory">
            <option value="">auto</option>
            <option>Zoom</option>
            <option>Google Meet</option>
            <option>Teams</option>
            <option>FaceTime</option>
            <option>Webex</option>
            <option>Slack</option>
            <option>Discord</option>
            <option>Other</option>
          </select>
        </div>

        <button id="meetingBtn" type="button">Start meeting transcription</button>

        <div id="meetingLive"></div>
        <div id="meetingSaved"></div>
      </div>
    </section>

    <section class="section" aria-labelledby="sec-transcripts">
      <div class="section-label" id="sec-transcripts">Transcripts</div>
      <div id="list"></div>
    </section>

    <footer class="colophon">
      <p>Mic access requires HTTPS or localhost. To use this from your phone over Tailscale, run <code>tailscale serve 8756</code> and open the printed https:// URL.</p>
    </footer>
  </div>

<script>
  const recordBtn = document.getElementById('recordBtn');
  const statusEl = document.getElementById('status');
  const errorEl = document.getElementById('error');
  const listEl = document.getElementById('list');
  const cleanCheckbox = document.getElementById('cleanCheckbox');

  let mediaRecorder = null;
  let chunks = [];
  let stream = null;
  let recording = false;
  let busy = false;

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }

  function clearError() {
    errorEl.style.display = 'none';
    errorEl.textContent = '';
  }

  function pickMimeType() {
    const candidates = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/ogg;codecs=opus',
      'audio/ogg',
      'audio/mp4',
    ];
    for (const type of candidates) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) {
        return type;
      }
    }
    return '';
  }

  function setBusy(isBusy) {
    busy = isBusy;
    recordBtn.classList.toggle('busy', isBusy);
    recordBtn.disabled = isBusy;
    // stopRecording() resets the label to 'Record' before the async onstop
    // handler gets here, so without this the transcribing button is
    // indistinguishable from idle — it reads 'Record' and ignores taps.
    recordBtn.textContent = isBusy ? 'Transcribing…' : (recording ? 'Stop' : 'Record');
  }

  async function startRecording() {
    clearError();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      showError('Microphone access failed: ' + err.message);
      return;
    }
    const mimeType = pickMimeType();
    try {
      mediaRecorder = mimeType
        ? new MediaRecorder(stream, { mimeType })
        : new MediaRecorder(stream);
    } catch (err) {
      showError('Recording not supported: ' + err.message);
      return;
    }
    chunks = [];
    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) chunks.push(e.data);
    };
    mediaRecorder.onstop = onRecordingStopped;
    mediaRecorder.start();
    recording = true;
    recordBtn.textContent = 'Stop';
    recordBtn.classList.add('recording');
    statusEl.textContent = 'recording…';
  }

  function stopRecording() {
    if (mediaRecorder && recording) {
      mediaRecorder.stop();
    }
    if (stream) {
      stream.getTracks().forEach((t) => t.stop());
    }
    recording = false;
    recordBtn.classList.remove('recording');
    recordBtn.textContent = 'Record';
  }

  async function onRecordingStopped() {
    const mimeType = mediaRecorder.mimeType || 'audio/webm';
    const blob = new Blob(chunks, { type: mimeType });
    if (blob.size === 0) {
      statusEl.textContent = '';
      return;
    }
    setBusy(true);
    statusEl.innerHTML = '<span class="spinner"></span>transcribing…';
    try {
      const ext = mimeType.includes('ogg') ? 'ogg' : mimeType.includes('mp4') ? 'm4a' : 'webm';
      const form = new FormData();
      form.append('file', blob, 'recording.' + ext);
      const clean = cleanCheckbox.checked ? 1 : 0;
      const resp = await fetch('/transcribe?clean=' + clean, {
        method: 'POST',
        body: form,
      });
      if (!resp.ok) {
        let detail = resp.statusText;
        try {
          const j = await resp.json();
          if (j.detail) detail = j.detail;
        } catch (_) {}
        throw new Error(detail);
      }
      const data = await resp.json();
      addTranscript(data.text, data.ms);
      clearError();
    } catch (err) {
      showError('Transcription failed: ' + err.message);
    } finally {
      setBusy(false);
      statusEl.textContent = '';
    }
  }

  function addTranscript(text, ms) {
    const item = document.createElement('div');
    item.className = 'item';

    const meta = document.createElement('div');
    meta.className = 'meta';
    const time = document.createElement('span');
    time.textContent = new Date().toLocaleTimeString() + ' · ' + ms + 'ms';
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copyBtn';
    copyBtn.textContent = 'copy';
    copyBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = 'copied';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'copy';
          copyBtn.classList.remove('copied');
        }, 1500);
      } catch (err) {
        showError('Copy failed: ' + err.message);
      }
    };
    meta.appendChild(time);
    meta.appendChild(copyBtn);

    const textEl = document.createElement('div');
    textEl.className = 'text';
    textEl.textContent = text || '(empty transcript)';

    item.appendChild(meta);
    item.appendChild(textEl);
    listEl.insertBefore(item, listEl.firstChild);
  }

  recordBtn.addEventListener('click', () => {
    if (busy) return;
    if (!recording) {
      startRecording();
    } else {
      stopRecording();
    }
  });

  // ---------------- meeting transcription ----------------
  const meetingBtn = document.getElementById('meetingBtn');
  const meetingBanner = document.getElementById('meetingBanner');
  const meetingPlatform = document.getElementById('meetingPlatform');
  const meetingDismiss = document.getElementById('meetingDismiss');
  const meetingTitle = document.getElementById('meetingTitle');
  const meetingCategory = document.getElementById('meetingCategory');
  const meetingLive = document.getElementById('meetingLive');
  const meetingSaved = document.getElementById('meetingSaved');
  const meetingWatchState = document.getElementById('meetingWatchState');

  let meetingActive = false;
  let meetingBusy = false;

  function fmtSeconds(s) {
    const m = Math.floor(s / 60);
    return m + 'm' + String(s % 60).padStart(2, '0') + 's';
  }

  async function pollMeeting() {
    try {
      const resp = await fetch('/meeting/status');
      if (!resp.ok) return;
      const st = await resp.json();
      meetingWatchState.textContent = st.watching
        ? (st.mic_busy ? 'mic in use' : 'watching')
        : (st.watch_error ? 'watcher off' : '');
      const showBanner = st.detected && !st.session;
      meetingBanner.style.display = showBanner ? 'block' : 'none';
      if (showBanner) {
        meetingPlatform.textContent = st.platform ? ' (' + st.platform + ')' : '';
      }
      meetingActive = !!st.session;
      if (st.session) {
        meetingBtn.textContent =
          'Stop & save notes — ' + fmtSeconds(st.session.seconds) +
          ' · ' + st.session.segment_count + ' segments';
        meetingBtn.classList.add('live');
        meetingLive.style.display = 'block';
        meetingLive.textContent = st.session.segments.length
          ? st.session.segments.map(s => '[' + s.stamp + '] ' + s.text).join('\n\n')
          : '(listening — first transcript segment lands after ~30s)';
        meetingLive.scrollTop = meetingLive.scrollHeight;
      } else if (!meetingBusy) {
        meetingBtn.textContent = 'Start meeting transcription';
        meetingBtn.classList.remove('live');
      }
      if (st.last_saved && !st.session) {
        meetingSaved.style.display = 'block';
        meetingSaved.textContent =
          'Saved: ' + st.last_saved.notes_path + ' (+ transcript log)';
      }
    } catch (_) { /* server briefly away; next poll recovers */ }
  }

  meetingDismiss.addEventListener('click', async () => {
    await fetch('/meeting/dismiss', { method: 'POST' });
    meetingBanner.style.display = 'none';
  });

  meetingBtn.addEventListener('click', async () => {
    if (meetingBusy) return;
    meetingBusy = true;
    meetingBtn.disabled = true;
    try {
      if (!meetingActive) {
        meetingSaved.style.display = 'none';
        const resp = await fetch('/meeting/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: meetingTitle.value || 'Meeting',
            category: meetingCategory.value,
          }),
        });
        if (!resp.ok) throw new Error((await resp.json()).detail || resp.statusText);
      } else {
        meetingBtn.textContent = 'Summarizing & saving…';
        const resp = await fetch('/meeting/stop', { method: 'POST' });
        if (!resp.ok) throw new Error((await resp.json()).detail || resp.statusText);
        const saved = await resp.json();
        meetingSaved.style.display = 'block';
        meetingSaved.textContent = 'Saved: ' + saved.notes_path + ' (+ transcript log)';
        meetingLive.style.display = 'none';
      }
      clearError();
    } catch (err) {
      showError('Meeting: ' + err.message);
    } finally {
      meetingBusy = false;
      meetingBtn.disabled = false;
      pollMeeting();
    }
  });

  setInterval(pollMeeting, 3000);
  pollMeeting();
</script>
</body>
</html>
