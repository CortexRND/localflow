# --------------------------------------------------------------------------
# Absolute caps, checked on the candidate regardless of baseline.
# --------------------------------------------------------------------------

# dims_match: exact match per key; `<key>_prefix` matches dims[<key>] by prefix.
# A cap may set max_value and/or min_value.

[[caps]]
suite = "stt"
metric = "latency_ms"
dims_match = { provider = "cpu", model_prefix = "tiny" }
max_value = 3000.0
reason = "Cross-platform target: tiny on CPU within 3 s"
