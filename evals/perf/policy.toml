# --------------------------------------------------------------------------
# Footprint suite (evals/perf/suites/footprint.py, evals/perf/adapters/)
# --------------------------------------------------------------------------

# Speech helper lifecycle: no helper process outside the loaded stages, and a
# fresh helper after reload (scripts/ci_speech_helper.py asserts the same).
[metrics.helper_pid_cleaned]
class = "exact"
on_pr = "block"

[metrics.helper_respawned]
class = "exact"
on_pr = "block"

[metrics.hwm_bytes]
class = "noisy"
better = "lower"
rel_tol = 0.10
mad_k = 3.0
block_factor = 2.0
on_pr = "warn"

[metrics.package_size_bytes]
class = "noisy"
better = "lower"
rel_tol = 0.10
mad_k = 3.0
block_factor = 2.0
on_pr = "warn"

[metrics.installed_size_bytes]
class = "noisy"
better = "lower"
rel_tol = 0.10
mad_k = 3.0
block_factor = 2.0
on_pr = "warn"

# Idle CPU over a 10-30 s window is a few clock ticks (10 ms each), so small
# absolute changes are large ratios: wide tolerance, hard block only at 10x.
[metrics.cpu_seconds]
class = "noisy"
better = "lower"
rel_tol = 0.50
mad_k = 3.0
block_factor = 10.0
on_pr = "warn"

# --------------------------------------------------------------------------
# Absolute caps, checked on the candidate regardless of baseline.
# --------------------------------------------------------------------------

# dims_match: exact match per key; `<key>_prefix` matches dims[<key>] by prefix.
# A cap may set max_value and/or min_value.

[[caps]]
suite = "stt"
metric = "latency_ms"
dims_match = { provider = "cpu", model_prefix = "tiny" }
max_value = 3000.0
reason = "Cross-platform target: tiny on CPU within 3 s"

# Meeting-sim quality floors, mirroring THRESH in evals/meeting_sim/gates.py
# (M8 requires every template section, i.e. 100 %). These hold on every run,
# not just relative to baseline.

[[caps]]
suite = "meetings"
metric = "M5"
min_value = 0.9
reason = "meeting_sim gate M5 >= 0.90"

[[caps]]
suite = "meetings"
metric = "M6"
min_value = 0.7
reason = "meeting_sim gate M6 >= 0.70"

[[caps]]
suite = "meetings"
metric = "M7"
max_value = 0.05
reason = "meeting_sim gate M7 <= 0.05"

[[caps]]
suite = "meetings"
metric = "M8"
min_value = 1.0
reason = "meeting_sim gate M8 >= 1.00"

[[caps]]
suite = "meetings"
metric = "M9"
min_value = 0.8
reason = "meeting_sim gate M9 >= 0.80"

[[caps]]
suite = "meetings"
metric = "M10"
min_value = 0.8
reason = "meeting_sim gate M10 >= 0.80"
