# Compare policy for lf-perf-result/v1 (see docs/plans/PLAN-perf-evals.md §6).
#
# Classes:
#   exact   - must equal / pass in every repeat; differing repeats are "flaky". Blocks PRs.
#   quality - candidate may not be worse than baseline by more than abs_tol. Blocks PRs.
#   noisy   - regression only if the median worsens by more than
#             max(rel_tol * |baseline|, mad_k * MAD(baseline samples)).
#             Warns on PRs (blocks with --strict); always blocks at >= block_factor x.
#
# `better` in a rule overrides the direction declared by the metric itself.
# Metrics without a rule fall back by unit: bytes -> noisy memory,
# ms/s/us/ratio -> noisy latency, bool -> exact.
#
# Absolute budgets are not invented up front: the first nightly run on main
# becomes the baseline and budgets are written here from it.

[defaults]
noisy_min_samples = 3        # smoke runs 3 repeats; nightly uses >= 5
noisy_mad_multiplier = 3.0
noisy_block_factor = 2.0
noisy_latency_rel_tol = 0.15
noisy_memory_rel_tol = 0.10

